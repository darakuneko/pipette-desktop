[package]
name = "pipette-app-config"
description = "The app config file <userData>/config.json, read and written as the Electron build's electron-store does"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = "=0.4.34"
pipette-fs = { path = "../pipette-fs" }
pipette-js-json = { path = "../pipette-js-json" }
thiserror = "=2.0.21"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
