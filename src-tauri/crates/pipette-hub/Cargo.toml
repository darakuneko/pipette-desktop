# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-hub"
description = "The Pipette Hub client: the HTTP layer of src/main/hub/*.ts (its three ways of reading a response, the 429 retry, the error messages), the multipart bodies, the input checks, where the Hub requests may go, and an in-memory Hub for the tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The in-memory Hub of src/fake.rs, for the tests of this crate and of the
# app.
test-util = []

[dependencies]
# The query strings of the list endpoints: the encoding of URLSearchParams.
form_urlencoded = "=1.2.2"
log = "=0.4.34"
# `trim` and `length` of the input checks, with JavaScript's meaning.
pipette-entry-store = { path = "../pipette-entry-store" }
# The Hub's JSON as JSON.parse reads it, in JavaScript's property order.
pipette-js-json = { path = "../pipette-js-json" }
# The requests, the clients and the Hub API base URL.
pipette-net = { path = "../pipette-net" }
thiserror = "=2.0.21"
# The wait before the retry of a 429.
tokio = { version = "=1.53.3", features = ["time"] }
# The id_token the Hub token is exchanged for.
zeroize = "=1.9.0"

[dev-dependencies]
pipette-hub = { path = ".", features = ["test-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "=1.53.3", features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
