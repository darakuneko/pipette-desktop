# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-sync-format"
description = "Formats shared with other machines through Cloud Sync: the encrypted envelope, Drive file names and the analytics machine hash"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Encryption with a caller-chosen salt, IV and timestamp. Tests only; real
# envelopes always take fresh random bytes.
test-util = []

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "getrandom"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
regex = "=1.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.21"

[dev-dependencies]
pipette-sync-format = { path = ".", features = ["test-util"] }

[lints]
workspace = true
