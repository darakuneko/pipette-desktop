# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-keyboard-stores"
description = "The per-keyboard stores under the userData directory: the keyboard names (sync/meta/keyboard-names.json) and the list of stored keyboards"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The clock, the per-key write locks and the JavaScript string helpers.
pipette-entry-store = { path = "../pipette-entry-store" }
pipette-fs = { path = "../pipette-fs" }
pipette-js-json = { path = "../pipette-js-json" }
pipette-time = { path = "../pipette-time" }
thiserror = "=2.0.21"

[dev-dependencies]
pipette-entry-store = { path = "../pipette-entry-store", features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
