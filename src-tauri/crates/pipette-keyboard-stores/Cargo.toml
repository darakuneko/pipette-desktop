# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-keyboard-stores"
description = "The per-keyboard stores under the userData directory: the keyboard names (sync/meta/keyboard-names.json), the list of stored keyboards, and the snapshots and pipette settings of each keyboard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The clock, the per-key write locks and the JavaScript string helpers.
pipette-entry-store = { path = "../pipette-entry-store" }
pipette-fs = { path = "../pipette-fs" }
pipette-js-json = { path = "../pipette-js-json" }
pipette-time = { path = "../pipette-time" }
# The etag of a settings file.
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.21"

[dev-dependencies]
pipette-entry-store = { path = "../pipette-entry-store", features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
