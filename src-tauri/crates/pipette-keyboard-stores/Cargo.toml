# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-keyboard-stores"
description = "The per-keyboard stores under the userData directory: the keyboard names (sync/meta/keyboard-names.json), the list of stored keyboards, and the snapshots, Analyze filters, Typing Test run logs and pipette settings of each keyboard; and the key labels, favorites and typing test texts kept across keyboards"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The clock, the per-key write locks and the JavaScript string helpers.
pipette-entry-store = { path = "../pipette-entry-store" }
pipette-fs = { path = "../pipette-fs" }
pipette-js-json = { path = "../pipette-js-json" }
pipette-time = { path = "../pipette-time" }
# The text rules of the typing test texts: the import normalization and the
# kana-only check.
pipette-typing-text = { path = "../pipette-typing-text" }
# The etag of a settings file.
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.21"

[dev-dependencies]
# The scenarios whose recorded files this host cannot hold.
pipette-fs = { path = "../pipette-fs", features = ["test-util"] }
pipette-entry-store = { path = "../pipette-entry-store", features = ["test-util"] }
# The pending store the userData tree of tests/rust_user_data.rs reports its
# changes to, as the app does.
pipette-sync-pending = { path = "../pipette-sync-pending" }
tempfile = { workspace = true }

[lints]
workspace = true
