# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-native"
description = "The window calls Tauri does not make on Windows and macOS, as Electron makes them there: a window's opacity and the aspect ratio of its content while the user resizes it. The only crate of the workspace with unsafe code, behind safe functions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The native handle of the app's window (tauri::Window implements its
# HasWindowHandle). Same version as Tauri uses.
raw-window-handle = "=0.6.2"
thiserror = { workspace = true }

# Win32: the layered window's alpha, and the subclass procedure that keeps
# the window layered and fits the size the user drags to the aspect ratio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# AppKit: NSWindow's alphaValue and contentAspectRatio. Same versions as tao
# uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }

# A real window for the tests of tests/macos_window.rs, which run on the
# main thread (harness = false).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }

[[test]]
name = "macos_window"
harness = false

# The workspace forbids unsafe code; this crate denies it everywhere but in
# the two modules that call the system (src/windows.rs, src/macos.rs) and
# their tests, where every unsafe block says why it is sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
