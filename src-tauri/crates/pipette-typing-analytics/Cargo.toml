# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-typing-analytics"
description = "The typing analytics above the SQLite cache: the installation id and machine hash, the sync state file, the cache freshness check, the database thread, startup, the reset lock, the JSONL masters, the deleted ranges, the keymap snapshots and the recording"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The clock and new ids the stores take, JavaScript's whitespace, the write
# locks and the path segment check.
pipette-entry-store = { path = "../pipette-entry-store" }
pipette-fs = { path = "../pipette-fs" }
# The JavaScript Map order of the minute buffer and the session detector.
indexmap = "=2.14.2"
pipette-js-json = { path = "../pipette-js-json" }
# The machine id and hash (node-machine-id's machineId(true)).
pipette-sync-format = { path = "../pipette-sync-format" }
# The sync lock and the reset lock, re-exported as `reset_lock`.
pipette-sync-runtime = { path = "../pipette-sync-runtime" }
pipette-time = { path = "../pipette-time" }
pipette-typing-analytics-db = { path = "../pipette-typing-analytics-db" }
# The warnings of the deleted-ranges store and of a failed keymap snapshot save.
log = "=0.4.34"
thiserror = "=2.0.21"
# The answers of the database thread.
tokio = { version = "=1.53.3", features = ["sync", "time", "rt"] }

# os.release(): uname(2) without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.2", features = ["system"] }

# os.release(): RtlGetVersion, as libuv reads it.
[target.'cfg(windows)'.dependencies]
windows-version = "=0.1.7"

[dev-dependencies]
pipette-entry-store = { path = "../pipette-entry-store", features = ["test-util"] }
# Runs the local-day fixtures once per time zone.
pipette-time = { path = "../pipette-time", features = ["test-util"] }
# The pending state the userData tree for the TypeScript code holds.
pipette-sync-pending = { path = "../pipette-sync-pending" }
# Sets an old schema version in a test database.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
# The digests of the compact data-operation fixtures.
sha2 = { version = "=0.10.9", default-features = false }
tempfile = { workspace = true }
tokio = { version = "=1.53.3", features = ["sync", "time", "rt", "macros", "test-util"] }

[lints]
workspace = true
