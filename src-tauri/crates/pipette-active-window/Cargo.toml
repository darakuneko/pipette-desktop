[package]
name = "pipette-active-window"
description = "The name of the active application for typing analytics, as the Electron build reads it: the native window lookup, the GNOME Shell FocusedWindow query, and the name normalization"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
