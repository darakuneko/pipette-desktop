# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-entry-store"
description = "The groundwork of the index-based entry stores: per-group clocks, entry normalization and writes, id-carrying body filenames, and the per-key write locks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# A settable clock and a fixed id sequence for the tests of the stores.
test-util = []

[dependencies]
# The per-key write locks (src/write_lock.rs).
pipette-fifo = { path = "../pipette-fifo" }
pipette-fs = { path = "../pipette-fs" }
# The JavaScript Map order of the merge's ids (src/merge.rs).
indexmap = "=2.14.2"
pipette-js-json = { path = "../pipette-js-json" }
pipette-time = { path = "../pipette-time" }
# `\p{L}` and `\p{N}` of safe_filename (src/safe_filename.rs).
regex = "=1.12.2"
# The body hash, the tie-break of equal body clocks.
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.21"
# crypto.randomUUID() of the stores' new ids.
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
pipette-entry-store = { path = ".", features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
