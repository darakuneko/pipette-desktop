# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-fs"
description = "File system groundwork: atomic writes, the userData directory and the Electron profile lock check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The OS config directory, the base of the default userData (the same one
# Electron's app.getPath('userData') is under). Tauri already pulls it in.
dirs = "=7.0.0"
thiserror = "=2.0.21"

# The host name and the process liveness check of the Electron lock
# (src/electron_lock.rs), without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.2", features = ["process", "system"] }

[features]
# What the host's file system can hold of a tree the golden tests recorded
# on Linux (src/test_util.rs).
test-util = []

[dev-dependencies]
regex = "=1.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = { workspace = true }

[lints]
workspace = true
