# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-drive"
description = "The Google Drive client of the sync on appDataFolder: one attempt of each operation behind the DriveApi trait (over HTTP or in memory for the tests), the retries, and the rules for duplicate copies and trash names"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The in-memory Drive (src/fake.rs). Every Rust test of the sync runs on it;
# none talks to a server.
test-util = []

[dependencies]
# The bulk deletes and renames run 5 requests at a time (src/client.rs).
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
# `Retry-After` in its HTTP-date form (src/retry.rs). The version and
# features pipette-time already uses.
jiff = "=0.2.38"
log = "=0.4.34"
# The HTTP requests of src/http.rs.
pipette-net = { path = "../pipette-net" }
# The data file names a trash name can carry (src/trash_names.rs).
pipette-sync-format = { path = "../pipette-sync-format" }
# `Date.parse` of the modifiedTime Drive writes, `Date.now()`, and the
# modifiedTime of the in-memory Drive's files.
pipette-time = { path = "../pipette-time" }
regex = "=1.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# The waits between attempts (src/retry.rs).
tokio = { version = "=1.53.3", features = ["time"] }

[dev-dependencies]
pipette-drive = { path = ".", features = ["test-util"] }
tokio = { version = "=1.53.3", features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
