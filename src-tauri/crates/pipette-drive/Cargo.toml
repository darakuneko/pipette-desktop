# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-drive"
description = "The Google Drive operations the sync uses on appDataFolder, one attempt each, behind the DriveApi trait, and an in-memory Drive for the tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The in-memory Drive (src/fake.rs). Every Rust test of the sync runs on it;
# none talks to a server.
test-util = ["dep:pipette-time"]

[dependencies]
thiserror = "=2.0.21"
# The modifiedTime of the in-memory Drive's files, as Drive writes it.
pipette-time = { path = "../pipette-time", optional = true }

[dev-dependencies]
pipette-drive = { path = ".", features = ["test-util"] }
# The conformance cases shared with the Node fake Drive
# (scripts/fake-drive/conformance-cases.json).
serde_json = { workspace = true }
tokio = { version = "=1.53.3", features = ["rt", "macros"] }

[lints]
workspace = true
