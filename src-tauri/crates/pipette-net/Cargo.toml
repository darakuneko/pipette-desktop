# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-net"
description = "The app's one way out to the network: an HTTP client with timeouts and a body size limit for GETs and for requests with a method, headers and a body, a client limited to the loopback interface, the client traits the stores and the sync take, and the Hub API base URL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = "=0.4.34"
# The HTTP client. The version Tauri already pulls in, without its default
# features (HTTP/2, charset decoding): HTTP/1.1 requests of plain bytes only.
# "rustls-no-provider": TLS with rustls and the OS's certificate
# verification (rustls-platform-verifier); the crypto provider is ring,
# installed by src/client.rs, rather than reqwest's default aws-lc-rs, which
# needs CMake and a larger C build. "system-proxy": the proxy settings of
# Windows and macOS; the proxy environment variables work everywhere.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "=2.0.21"

[features]
# Reads the Google endpoint variables (src/google.rs). The app's
# development tools turn it on; a release build has no code that reads them.
url-override = []

[dev-dependencies]
# A runtime for the tests' requests; reqwest runs on Tokio.
tokio = { version = "=1.53.3", features = ["rt"] }

[lints]
workspace = true
