# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-hid"
description = "Raw HID transport for Vial keyboards (hidapi, Linux hidraw) with the virtual keyboard wired in"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Constructors that take a custom hardware backend and timing (clock, retry
# delay). Tests only; the application uses HidService::new.
test-util = []

[dependencies]
# Requests are sent in the order they were issued.
pipette-fifo = { path = "../pipette-fifo" }
pipette-protocol = { path = "../pipette-protocol" }
# The wall clock of src/timing.rs.
pipette-time = { path = "../pipette-time" }
pipette-virtual-device = { workspace = true }
hidapi = { workspace = true }
thiserror = { workspace = true }
# HID packet logs (src/packet_log.rs), when VIAL_DEBUG_HID is set.
log = "=0.4.34"

[dev-dependencies]
pipette-hid = { path = ".", features = ["test-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
log = { version = "=0.4.34", features = ["std"] }
pipette-logger = { path = "../pipette-logger" }

[lints]
workspace = true
