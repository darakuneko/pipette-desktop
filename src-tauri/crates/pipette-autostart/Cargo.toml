# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "pipette-autostart"
description = "Starting the app at sign-in, as applyAutoLaunch of src/main/app-behavior.ts does"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log = "=0.4.34"

# The login item of Windows (the Run key of the current user) and macOS
# (SMAppService), Electron's app.setLoginItemSettings. MIT. Linux writes the
# desktop entry itself (src/linux.rs), byte for byte the one Electron writes.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
auto-launch = { version = "=0.6.0", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { version = "=0.4.34", features = ["std"] }

[lints]
workspace = true
