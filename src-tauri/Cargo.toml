# SPDX-License-Identifier: GPL-2.0-or-later
#
# Tauri application crate (root package) and the Cargo workspace for the
# Rust backend. Library crates live under crates/*.

[package]
name = "pipette-app"
description = "Pipette desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# tauri 2.12 needs a newer toolchain than the library crates.
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# "tray-icon": the tray of src/lifecycle.rs.
tauri = { version = "=2.12.1", features = ["tray-icon"] }
# The quit sequence (src/shutdown.rs) times its phases on the Tokio runtime
# Tauri already runs, and src/lifecycle.rs listens for SIGTERM / SIGINT.
tokio = { version = "=1.53.3", features = ["rt", "time", "signal"] }
pipette-hid = { path = "crates/pipette-hid" }
pipette-fs = { path = "crates/pipette-fs" }
pipette-logger = { path = "crates/pipette-logger" }
pipette-app-config = { path = "crates/pipette-app-config" }
pipette-js-json = { path = "crates/pipette-js-json" }
pipette-sync-pending = { path = "crates/pipette-sync-pending" }
# The stores of src/store_commands/: the clock and write locks they share,
# and the stores themselves.
pipette-entry-store = { path = "crates/pipette-entry-store" }
pipette-keyboard-stores = { path = "crates/pipette-keyboard-stores" }
log = "=0.4.34"
serde = { workspace = true }
# The pending marker of the quit sequence (src/shutdown.rs).
serde_json = { workspace = true }
# Keyboard definition decompression (src/definition.rs): LZMA-alone with
# lzma-rs; XZ with xz4rust, whose decoder streams its output so the size
# limit applies while decoding (lzma-rs buffers a whole XZ block first).
# Without the "sha256" feature a SHA-256 checked stream fails, as it does
# with the xz-decompress package of the Electron main process.
lzma-rs = { workspace = true }
xz4rust = { version = "=0.2.3", default-features = false, features = ["std", "no_unsafe", "crc64"] }
# TypeScript declarations of the types that cross the IPC boundary, written
# to src/tauri-shim/generated by the export tests (`cargo test`; the
# directory is set in .cargo/config.toml at the repository root). The
# conventions are in src/tauri-shim/__tests__/contract-types.ts. A normal
# dependency: the derives sit on the production types, and as a
# dev-dependency every derive and #[ts] attribute would need cfg_attr(test).
ts-rs = "=12.0.1"
# Opens links in the browser (src/shell.rs). Only its Rust functions are
# used: the plugin is not registered, so the page gets none of its commands.
tauri-plugin-opener = "=2.7.2"
# One instance of the app at a time (src/main.rs). On Linux the running app
# owns the D-Bus name `<identifier>.SingleInstance` on the session bus, so a
# dev and a bundled build (same identifier) exclude each other. Without a
# session bus (DBUS_SESSION_BUS_ADDRESS unset and no bus at the default
# socket, or the bus unreachable) every launch runs; a set but unparsable
# DBUS_SESSION_BUS_ADDRESS makes the plugin panic at startup.
tauri-plugin-single-instance = "=2.5.2"
thiserror = "=2.0.21"

# The WebKitGTK view behind the Linux window, for the window screenshots of
# the development tools (src/dev_commands/tools.rs). Same versions as wry uses.
# gtk (the version tao uses) tells whether the window runs on Wayland, where
# it cannot read its position (src/main_window.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = { version = "=2.0.2", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }

[features]
# The development tools of src/dev_commands/tools.rs. build.rs rejects the
# feature in the release profile, so a bundled binary never has these commands
# or links WebKitGTK's bindings or cairo.
dev-tools = ["dep:webkit2gtk", "dep:cairo-rs"]

[dev-dependencies]
# A scripted hardware keyboard behind the IPC contract tests' HID service
# (src/ipc_contract.rs), for the probe commands.
pipette-hid = { path = "crates/pipette-hid", features = ["test-util"] }
# Fixed entry ids for the store command tests (src/store_commands/).
pipette-entry-store = { path = "crates/pipette-entry-store", features = ["test-util"] }
sha2 = { version = "=0.10.9", default-features = false }
hex = "=0.4.3"
# The permission sets (permissions/*.toml) the capability tests read.
toml = "=1.1.8"
# Paused time for the quit sequence tests.
tokio = { version = "=1.53.3", features = ["rt", "test-util"] }
# The mock runtime the IPC contract tests (src/ipc_contract.rs) run the app
# commands on. Same version as the tauri dependency.
tauri = { version = "=2.12.1", features = ["tray-icon", "test"] }
tempfile = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
rust-version = "1.85"

[workspace.dependencies]
pipette-virtual-device = { path = "crates/pipette-virtual-device" }
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lzma-rs = "=0.3.0"
# Self-removing temporary directories for the tests. 3.23 is the newest
# release that accepts the rustix pinned by crates/pipette-fs.
tempfile = "=3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# The sync format's PBKDF2 runs 600,000 iterations per key derivation, which
# takes seconds per call when unoptimized. Optimizing just the crypto crates
# keeps dev builds and tests fast without slowing every compile.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
