# SPDX-License-Identifier: GPL-2.0-or-later
#
# Tauri application crate (root package) and the Cargo workspace for the
# Rust backend. Library crates live under crates/*.

[package]
name = "pipette-app"
description = "Pipette desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# tauri 2.12 needs a newer toolchain than the library crates.
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
pipette-hid = { path = "crates/pipette-hid" }
serde = { workspace = true }

# The WebKitGTK view behind the Linux window, for the window screenshots of
# the development tools (src/dev_commands.rs). Same versions as wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
cairo-rs = { version = "0.18", features = ["png"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.27"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
rust-version = "1.85"

[workspace.dependencies]
pipette-virtual-device = { path = "crates/pipette-virtual-device" }
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lzma-rs = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# The sync format's PBKDF2 runs 600,000 iterations per key derivation, which
# takes seconds per call when unoptimized. Optimizing just the crypto crates
# keeps dev builds and tests fast without slowing every compile.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
