#
# The app config commands of src/app_config.rs.

[[set]]
identifier = "app-config"
description = "Reads the app config, sets its fields and reads where the log files are written."
permissions = ["allow-app-config-get-all", "allow-app-config-set", "allow-app-config-log-dir"]
