#
# The commands of src/sync_commands/password_change.rs: changing the sync
# password on Drive and the steps around it (status, resume, revert,
# abandon, deleting the files neither password opens), the Drive lock's
# status and release, and the files the stored password does not open.
# The passwords go in; they never come back to the page.

[[set]]
identifier = "sync-password-change"
description = "Changes the sync password on Drive, resumes, reverts or abandons a change, deletes the files neither password opens, reads and releases the Drive lock, and lists the files the stored password does not open."
permissions = [
  "allow-sync-change-password",
  "allow-sync-password-change-status",
  "allow-sync-password-change-resume",
  "allow-sync-password-change-revert",
  "allow-sync-password-change-abandon",
  "allow-sync-password-change-delete-undecryptable",
  "allow-sync-password-change-lock-status",
  "allow-sync-password-change-release-locks",
  "allow-sync-list-undecryptable",
]
