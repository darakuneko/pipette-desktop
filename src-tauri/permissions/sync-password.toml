#
# The commands of src/sync_commands/password.rs and preflight.rs that reach
# Drive: setting and re-entering the sync password, whether Drive has a
# password-check, and the sync-format status of the update banner. The
# password goes in; it never comes back to the page.

[[set]]
identifier = "sync-password"
description = "Sets or re-enters the sync password against the password-check on Drive, and reports whether Drive has one and which sync format it needs."
permissions = [
  "allow-sync-set-password",
  "allow-sync-replace-password",
  "allow-sync-check-password-exists",
  "allow-sync-format-status",
]
