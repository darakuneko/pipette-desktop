#
# The commands of src/sync_commands/: the sync's sign-in and password
# statuses. The secrets themselves never reach the page.

[[set]]
identifier = "sync-auth"
description = "Reports whether the sync is signed in and whether its stored password can be read."
permissions = [
  "allow-sync-auth-status",
  "allow-sync-password-status",
]
