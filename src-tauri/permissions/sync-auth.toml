#
# The commands of src/sync_commands/: the sync's sign-in, its sign-out, and
# the sign-in and password statuses. The secrets themselves never reach the
# page.

[[set]]
identifier = "sync-auth"
description = "Signs the sync in and out, and reports whether it is signed in and whether its stored password can be read."
permissions = [
  "allow-sync-auth-status",
  "allow-sync-auth-start",
  "allow-sync-auth-sign-out",
  "allow-sync-password-status",
]
