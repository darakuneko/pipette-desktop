#
# The commands of src/analytics_commands/queries.rs: the reads of the
# typing analytics cache for the Analyze view and the Data modal.

[[set]]
identifier = "typing-analytics"
description = "Reads the typing analytics of the Analyze view and the Data modal: the keyboards with data, the daily, interval, activity, layer, matrix, minute, session, Backspace and peak reads for every device, this device or one device, the typing-view heatmap, the devices of a keyboard and the local day files."
permissions = [
  "allow-typing-analytics-list-keyboards",
  "allow-typing-analytics-list-items",
  "allow-typing-analytics-list-items-local",
  "allow-typing-analytics-list-items-for-hash",
  "allow-typing-analytics-list-interval-items",
  "allow-typing-analytics-list-interval-items-local",
  "allow-typing-analytics-list-interval-items-for-hash",
  "allow-typing-analytics-list-activity-grid",
  "allow-typing-analytics-list-activity-grid-local",
  "allow-typing-analytics-list-activity-grid-for-hash",
  "allow-typing-analytics-list-layer-usage",
  "allow-typing-analytics-list-layer-usage-local",
  "allow-typing-analytics-list-layer-usage-for-hash",
  "allow-typing-analytics-list-matrix-cells",
  "allow-typing-analytics-list-matrix-cells-local",
  "allow-typing-analytics-list-matrix-cells-for-hash",
  "allow-typing-analytics-list-matrix-cells-by-day",
  "allow-typing-analytics-list-matrix-cells-by-day-local",
  "allow-typing-analytics-list-matrix-cells-by-day-for-hash",
  "allow-typing-analytics-list-minute-stats",
  "allow-typing-analytics-list-minute-stats-local",
  "allow-typing-analytics-list-minute-stats-for-hash",
  "allow-typing-analytics-list-sessions",
  "allow-typing-analytics-list-sessions-local",
  "allow-typing-analytics-list-sessions-for-hash",
  "allow-typing-analytics-list-bks-minute",
  "allow-typing-analytics-list-bks-minute-local",
  "allow-typing-analytics-list-bks-minute-for-hash",
  "allow-typing-analytics-get-peak-records",
  "allow-typing-analytics-get-peak-records-local",
  "allow-typing-analytics-get-peak-records-for-hash",
  "allow-typing-analytics-get-matrix-heatmap",
  "allow-typing-analytics-list-device-infos",
  "allow-typing-analytics-list-local-device-days",
]
