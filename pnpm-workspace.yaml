# The packages whose install scripts run (pnpm 11's per-package map).
# esbuild's binary install needs its script; core-js's postinstall is just a
# sponsorship console message (no build). edgedriver's and geckodriver's
# download browser drivers WebdriverIO can fetch on its own; the Tauri e2e
# (e2e-tauri/) talks to tauri-driver and uses neither.
allowBuilds:
  core-js: false
  edgedriver: false
  esbuild: true
  geckodriver: false
