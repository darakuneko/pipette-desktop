name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Tests rely on local wall-clock semantics that the codebase
      # standardises on JST (e.g. analyze-streak-goal `resolveGoalAt`
      # uses `toLocalDate`). Pin the runner to Asia/Tokyo so date-based
      # goal-history comparisons match the developer-machine baseline.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies for native modules and Xvfb for the Electron E2E specs
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev xvfb

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: npx tsx scripts/check-hook-deps-tdz.ts
      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright OS dependencies for the Electron E2E specs
        run: npx playwright install-deps

      # Only specs tagged @virtual run in CI — they're self-contained: they
      # drive the software-emulated Virtual Keyboard device or a dummy JSON
      # definition. Other e2e specs assume real hardware or a local Hub
      # instance and can't run on a CI runner.
      - name: Run @virtual-tagged E2E specs against the virtual device
        run: xvfb-run -a npx playwright test --grep @virtual

      - run: pnpm run doc:guide
      - name: Verify generated docs are up to date
        run: bash scripts/check-docs-fresh.sh
