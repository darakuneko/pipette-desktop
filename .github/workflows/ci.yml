name: CI

on:
  pull_request:
    branches: [main]
  # tauri-migration.yml runs this check on the Tauri migration branches.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push to the same pull request or branch cancels the run in
    # progress. On the job, not the workflow: run through workflow_call, the
    # caller's own concurrency group applies to the workflow, and
    # github.workflow (the caller's name there) keeps the groups apart.
    concurrency:
      group: ci-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Tests rely on local wall-clock semantics that the codebase
      # standardises on JST (e.g. analyze-streak-goal `resolveGoalAt`
      # uses `toLocalDate`). Pin the runner to Asia/Tokyo so date-based
      # goal-history comparisons match the developer-machine baseline.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: npx tsx scripts/check-hook-deps-tdz.ts
      - run: pnpm test

      - run: pnpm run doc:guide
      - name: Verify generated docs are up to date
        run: bash scripts/check-docs-fresh.sh
