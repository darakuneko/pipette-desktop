name: Tauri migration

# Checks the Tauri migration branch and the work branches cut from it. The
# Electron check is the check job of ci.yml, which on its own runs only on
# pull requests to main, so the Electron build stays green on these branches
# too; here it also checks the fixtures under src-tauri against their
# generators.
on:
  push:
    branches:
      - feat/tauri-migration
      - "feat/tauri-*"
  pull_request:
    branches:
      - feat/tauri-migration

permissions:
  contents: read

concurrency:
  group: tauri-migration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-check:
    uses: ./.github/workflows/ci.yml
    with:
      check-fixtures: true

  tauri:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust

      # The install scripts only serve the Electron build (the Electron binary
      # download and the native module rebuild); the Tauri build needs none.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Clippy (debug, with the development tools)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --features pipette-app/dev-tools -- -D warnings

      # The export tests in the next step write every file again (the ts-rs
      # declarations and the app command names), so one whose Rust source is
      # gone shows up as deleted below.
      - name: Clear the generated shim files
        run: rm -rf src/tauri-shim/generated

      # PIPETTE_REQUIRE_FAKE_OAUTH: the sign-in test against the Node fake
      # Google (tests/node_fake_oauth.rs of pipette-google-auth) must run,
      # not skip.
      - name: Test
        working-directory: src-tauri
        env:
          PIPETTE_REQUIRE_FAKE_OAUTH: "1"
        run: cargo test --workspace --features pipette-app/dev-tools

      # The step above builds pipette-net with the endpoint variables of the
      # development tools; without them, as in a release build, the
      # variables must change nothing. The test exists only without the
      # url-override feature, so a build that turns the feature on runs
      # nothing here: require that it ran.
      - name: Test the Google endpoints without the development tools
        working-directory: src-tauri
        shell: bash
        run: |
          output=$(cargo test -p pipette-net --test endpoints -- --exact a_release_build_ignores_the_variables)
          echo "$output"
          grep -q 'test result: ok\. 1 passed' <<< "$output"

      # The Node fake Drive passes the conformance cases the in-memory Drive
      # of pipette-drive passes (in the step above), the Node fake Hub passes
      # the cases it shares with the in-memory Hub of pipette-hub and serves
      # the desktop app's Hub client, and the harness of the sync fixture
      # generators keeps the Electron code off the network and the real
      # userData.
      - name: Fake Drive, fake Hub and sync fixture harness
        run: |
          pnpm run test:fake-drive
          pnpm run test:fake-hub
          pnpm run test:sync-fixtures-harness

      # The test above wrote userData trees with the Rust stores (the
      # tests/rust_user_data.rs of pipette-keyboard-stores,
      # pipette-pack-stores and pipette-typing-datasets); the Electron
      # build's handlers must read them, answer as the crates do and write
      # nothing. The tree of pipette-typing-analytics (its
      # tests/rust_user_data.rs) must give the same machine hash, keep or
      # rebuild the same cache and answer every query member the same.
      # The sync interop test runs the Electron sync code and the Rust
      # engine (pipette-sync's example sync_peer) against one Node fake
      # Drive, and has the Electron code sync a copy of the userData the
      # Rust engine synced without changing it.
      - name: Read the Rust stores' userData with the Electron handlers
        run: |
          pnpm run verify:keyboard-store-rust-user-data
          pnpm run verify:pack-store-rust-user-data
          pnpm run verify:typing-dataset-rust-user-data
          pnpm run verify:analytics-rust-user-data
          (cd src-tauri && cargo build -p pipette-sync --example sync_peer)
          pnpm run test:sync-interop

      # --intent-to-add makes a new file show up in the diff too;
      # comparing with HEAD keeps a deleted one in it even when the add
      # stages the deletion.
      - name: Check the generated shim files are committed
        run: |
          git add --intent-to-add src/tauri-shim/generated
          git diff --exit-code HEAD -- src/tauri-shim/generated

      # Builds the renderer for Tauri too, so it also checks the frontend
      # build and its wiring in tauri.conf.json. The e2e tests below drive
      # this binary.
      - name: Debug build
        run: pnpm tauri:build:debug

      # The WebDriver of WebKitGTK is webkit2gtk-driver up to Ubuntu 24.04 and
      # webkitgtk-webdriver from 26.04 on. xvfb gives the app a display and
      # dbus-run-session a session bus of its own, as a desktop session has
      # (the tray icon registers on it, and the single-instance guard owns a
      # name on it).
      - name: Install the e2e dependencies
        run: |
          # apt-cache show also succeeds for a name that is only referred to,
          # so the check is for an installable candidate.
          if LC_ALL=C apt-cache policy webkitgtk-webdriver | grep -q 'Candidate: [0-9]'; then
            driver=webkitgtk-webdriver
          else
            driver=webkit2gtk-driver
          fi
          sudo apt-get install -y "$driver" xvfb dbus

      # rust-cache keeps ~/.cargo/bin, so a cached tauri-driver of this
      # version makes the install a no-op.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      # The screen is larger than xvfb-run's default of 1280x1024, which is
      # the window's minimum size: the window-state test moves and resizes
      # the window inside it.
      - name: e2e (Tauri)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" dbus-run-session -- pnpm test:e2e:tauri

  # The machine hash and the OS strings of the typing-analytics fingerprint
  # must be the values the Electron build computes on the same machine, or
  # the same PC shows as another device. Node reports them on each OS and
  # the Rust test compares its own (tests/node_identity.rs of
  # pipette-typing-analytics), printing no value.
  node-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The toolchain of src-tauri/rust-toolchain.toml; the crate needs none
      # of the Linux packages setup-rust installs for the app.
      - name: Install the Rust toolchain
        working-directory: src-tauri
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: pnpm run generate:node-identity

      - name: Compare with Node
        working-directory: src-tauri
        env:
          PIPETTE_REQUIRE_NODE_IDENTITY: "1"
        run: cargo test -p pipette-typing-analytics --test node_identity

  # The OS key store the sync's master key lives in (the os_keystore test of
  # pipette-secret-store): the Keychain on macOS, the Credential Manager on
  # Windows, and on Linux a Secret Service of the test's own inside an
  # isolated dbus-run-session (scripts/keystore-it-linux.sh), with and
  # without one.
  keystore:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Secret Service and the session bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus libdbus-1-dev pkg-config

      - name: Install the Rust toolchain
        working-directory: src-tauri
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Key store (Linux, without and with a Secret Service)
        if: runner.os == 'Linux'
        run: |
          scripts/keystore-it-linux.sh unavailable
          scripts/keystore-it-linux.sh available

      - name: Key store (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: src-tauri
        env:
          PIPETTE_KEYSTORE_IT: available
        run: cargo test -p pipette-secret-store --test os_keystore -- --test-threads=1

  # Kept off the job above so the release build does not lengthen it.
  tauri-lint:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust

      - name: Format
        run: cargo fmt --all --check

      # Without the development tools: build.rs rejects them in the release
      # profile.
      - name: Clippy (release)
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      # The development tools' variables (the plain-text key file, the
      # browserless sign-in, the Google endpoint overrides) must not even be
      # named in the binary a release build bundles.
      - name: The release binary has no development variables
        run: |
          cargo build --release -p pipette-app
          for name in PIPETTE_DEV_KEYSTORE PIPETTE_DEV_SUPPRESS_BROWSER PIPETTE_GOOGLE_AUTH_URL PIPETTE_GOOGLE_TOKEN_URL PIPETTE_DRIVE_API_URL PIPETTE_DRIVE_UPLOAD_URL; do
            if grep -a -q "$name" target/release/pipette-app; then
              echo "the release binary names $name"
              exit 1
            fi
          done
