name: Tauri migration

# Checks the Tauri migration branch and the work branches cut from it. The
# Electron check is the check job of ci.yml, which on its own runs only on
# pull requests to main, so the Electron build stays green on these branches
# too; here it also checks the fixtures under src-tauri against their
# generators.
on:
  push:
    branches:
      - feat/tauri-migration
      - "feat/tauri-*"
  pull_request:
    branches:
      - feat/tauri-migration

permissions:
  contents: read

concurrency:
  group: tauri-migration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-check:
    uses: ./.github/workflows/ci.yml
    with:
      check-fixtures: true

  tauri:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust

      # The install scripts only serve the Electron build (the Electron binary
      # download and the native module rebuild); the Tauri build needs none.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Clippy (debug, with the development tools)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --features pipette-app/dev-tools -- -D warnings

      # The export tests in the next step write every file again (the ts-rs
      # declarations and the app command names), so one whose Rust source is
      # gone shows up as deleted below.
      - name: Clear the generated shim files
        run: rm -rf src/tauri-shim/generated

      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace --features pipette-app/dev-tools

      # The test above wrote userData trees with the Rust stores (the
      # tests/rust_user_data.rs of pipette-keyboard-stores,
      # pipette-pack-stores and pipette-typing-datasets); the Electron
      # build's handlers must read them, answer as the crates do and write
      # nothing. The tree of pipette-typing-analytics (its
      # tests/rust_user_data.rs) must give the same machine hash, keep or
      # rebuild the same cache and answer every query member the same.
      - name: Read the Rust stores' userData with the Electron handlers
        run: |
          pnpm run verify:keyboard-store-rust-user-data
          pnpm run verify:pack-store-rust-user-data
          pnpm run verify:typing-dataset-rust-user-data
          pnpm run verify:analytics-rust-user-data

      # --intent-to-add makes a new file show up in the diff too;
      # comparing with HEAD keeps a deleted one in it even when the add
      # stages the deletion.
      - name: Check the generated shim files are committed
        run: |
          git add --intent-to-add src/tauri-shim/generated
          git diff --exit-code HEAD -- src/tauri-shim/generated

      # Builds the renderer for Tauri too, so it also checks the frontend
      # build and its wiring in tauri.conf.json. The e2e tests below drive
      # this binary.
      - name: Debug build
        run: pnpm tauri:build:debug

      # The WebDriver of WebKitGTK is webkit2gtk-driver up to Ubuntu 24.04 and
      # webkitgtk-webdriver from 26.04 on. xvfb gives the app a display and
      # dbus-run-session a session bus of its own, as a desktop session has
      # (the tray icon registers on it, and the single-instance guard owns a
      # name on it).
      - name: Install the e2e dependencies
        run: |
          # apt-cache show also succeeds for a name that is only referred to,
          # so the check is for an installable candidate.
          if LC_ALL=C apt-cache policy webkitgtk-webdriver | grep -q 'Candidate: [0-9]'; then
            driver=webkitgtk-webdriver
          else
            driver=webkit2gtk-driver
          fi
          sudo apt-get install -y "$driver" xvfb dbus

      # rust-cache keeps ~/.cargo/bin, so a cached tauri-driver of this
      # version makes the install a no-op.
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      # The screen is larger than xvfb-run's default of 1280x1024, which is
      # the window's minimum size: the window-state test moves and resizes
      # the window inside it.
      - name: e2e (Tauri)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" dbus-run-session -- pnpm test:e2e:tauri

  # The machine hash and the OS strings of the typing-analytics fingerprint
  # must be the values the Electron build computes on the same machine, or
  # the same PC shows as another device. Node reports them on each OS and
  # the Rust test compares its own (tests/node_identity.rs of
  # pipette-typing-analytics), printing no value.
  node-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The toolchain of src-tauri/rust-toolchain.toml; the crate needs none
      # of the Linux packages setup-rust installs for the app.
      - name: Install the Rust toolchain
        working-directory: src-tauri
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: pnpm run generate:node-identity

      - name: Compare with Node
        working-directory: src-tauri
        env:
          PIPETTE_REQUIRE_NODE_IDENTITY: "1"
        run: cargo test -p pipette-typing-analytics --test node_identity

  # Kept off the job above so the release build does not lengthen it.
  tauri-lint:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust

      - name: Format
        run: cargo fmt --all --check

      # Without the development tools: build.rs rejects them in the release
      # profile.
      - name: Clippy (release)
        run: cargo clippy --workspace --all-targets --release -- -D warnings
