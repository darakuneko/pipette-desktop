name: Tauri bundle (Windows, macOS)

# Builds the Tauri app on Windows and macOS, which no other job compiles:
# clippy over the whole workspace in the debug build with the development
# tools and in the release build, the tests of the crates with code of
# their own on these systems, and an unsigned bundle of each as an
# artifact. Run by hand. GitHub dispatches only a workflow it knows, and it
# learns of one on a branch other than the default from a push that runs
# it, so a push that changes this file runs it too.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/tauri-migration
      - "feat/tauri-*"
    paths:
      - .github/workflows/tauri-bundle.yml

permissions:
  contents: read

concurrency:
  group: tauri-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          # Apple silicon, the only macOS build that is released.
          - os: macos-latest
            bundles: app,dmg
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # The install scripts only serve the Electron build; the Tauri CLI
      # and the frontend build need none.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The toolchain of src-tauri/rust-toolchain.toml; setup-rust installs
      # the Linux packages of the app and runs on Linux only.
      - name: Install the Rust toolchain
        working-directory: src-tauri
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Clippy (debug, with the development tools)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --features pipette-app/dev-tools -- -D warnings

      # Without the development tools: build.rs rejects them in the release
      # profile.
      - name: Clippy (release)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      # The crates whose code differs on these systems. None of them
      # reaches the OS's login item (pipette-autostart panics in a test
      # that would) or its key store (the os_keystore test of
      # pipette-secret-store skips without PIPETTE_KEYSTORE_IT; the keystore
      # job of tauri-migration.yml runs it on purpose).
      - name: Test
        working-directory: src-tauri
        run: cargo test -p pipette-autostart -p pipette-notification -p pipette-active-window -p pipette-secret-store

      # The release build, unsigned. The bundles are given here because
      # tauri.conf.json lists the Linux ones.
      - name: Bundle
        run: pnpm exec tauri build --ci --no-sign --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipette-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
