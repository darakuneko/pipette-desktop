name: Tauri bundle (Windows, macOS)

# Builds the Tauri app on Windows and macOS, which no other job compiles:
# clippy over the whole workspace in the debug build with the development
# tools and in the release build, the workspace's tests, and an unsigned
# bundle of each as an artifact, each in a job of its own. Runs weekly on the
# default branch (a schedule runs only there) and by hand on any branch. A
# run reads only the Cargo caches of its own ref and of the default branch,
# so a run by hand on a branch no earlier run built on starts from the
# default branch's.
on:
  workflow_dispatch:
  schedule:
    # Sundays at 18:00 UTC.
    - cron: "0 18 * * 0"

permissions:
  contents: read

# Line tables are enough for the backtraces of a failed test, and the test
# binaries and their caches get much smaller; Cargo colours its output in the
# logs. Set the same in every workflow that builds src-tauri: rust-cache puts
# the CARGO_* variables in its key, and the workflows share keys.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

concurrency:
  group: tauri-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      # The files as committed: Git for Windows would turn the line ends
      # into CRLF.
      - name: Keep the line ends
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not setup-rust: it installs the Linux packages of the app and runs on
      # Linux only.
      - uses: ./.github/actions/install-rust-toolchain

      # Clippy checks rather than builds, so it gains little from a cache
      # of its own; it reads the test job's (the build scripts and the
      # procedural macros) and saves nothing. Never on a tag (a run by hand
      # can be on one).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: src-tauri -> target
          key: bundle-test
          add-job-id-key: false
          save-if: false

      - name: Clippy (debug, with the development tools)
        run: cargo clippy --workspace --all-targets --features pipette-app/dev-tools -- -D warnings

      # Without the development tools: build.rs rejects them in the release
      # profile.
      - name: Clippy (release)
        run: cargo clippy --workspace --all-targets --release -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The files as committed: Git for Windows would turn the line ends of
      # the fixtures and sample packs the tests compare byte for byte into
      # CRLF.
      - name: Keep the line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # The tests start the Node fakes.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/install-rust-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: src-tauri -> target
          key: bundle-test
          add-job-id-key: false

      # cargo-nextest runs the test binaries side by side, one process per
      # test; cargo test runs one binary at a time, and a few slow ones keep
      # the rest waiting. A prebuilt binary, checked against its checksum.
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.146
          fallback: none

      # The whole workspace, so the code each crate has for systems other
      # than Linux runs too, every test binary even after one fails. The
      # Linux-only tests are not built here, the Node fakes listen on the
      # loopback interface only, the OS's key store test skips without
      # PIPETTE_KEYSTORE_IT (the keystore job of ci.yml runs it on
      # purpose), and no test reaches the OS's login item
      # (pipette-autostart panics in a test that would).
      - name: Test
        working-directory: src-tauri
        run: |
          status=0
          cargo nextest run --workspace --no-fail-fast || status=$?
          # cargo-nextest runs no doc tests; they run even after a failure.
          cargo test --workspace --doc --no-fail-fast || status=$?
          exit "$status"

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image release.yml builds the Windows release on (Visual
          # Studio 2022).
          - os: windows-2022
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          # Apple silicon, the only macOS build that is released.
          - os: macos-latest
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep the line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/install-rust-toolchain

      # The build-tauri job of release.yml builds the same on these systems
      # and reads this cache (never on a tag).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: src-tauri -> target
          key: bundle
          add-job-id-key: false

      # The release build, unsigned (release.yml signs the macOS app), with
      # the bundles tauri.<platform>.conf.json lists.
      - name: Bundle
        run: pnpm exec tauri build --ci --no-sign

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipette-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
