name: Tauri bundle (Windows, macOS)

# Builds the Tauri app on Windows and macOS, which no other job compiles:
# clippy over the whole workspace in the debug build with the development
# tools and in the release build, the workspace's tests, and an unsigned
# bundle of each as an artifact. Run by hand. GitHub dispatches only a
# workflow it knows, and it learns of one on a branch other than the
# default from a push that runs it, so a push that changes this file runs
# it too.
#
# Dispatch it on feat/tauri-migration: a run reads only the Cargo caches of
# its own ref and of the default branch, so a run on a branch no earlier
# run built on starts cold.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/tauri-migration
      - "feat/tauri-*"
    paths:
      - .github/workflows/tauri-bundle.yml

permissions:
  contents: read

# Line tables are enough for the backtraces of a failed test, and the test
# binaries and their caches get much smaller. Set the same in every workflow
# that builds src-tauri: rust-cache puts the CARGO_* variables in its key,
# and the workflows share keys.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: tauri-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image release.yml builds the Windows release on (Visual
          # Studio 2022).
          - os: windows-2022
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          # Apple silicon, the only macOS build that is released.
          - os: macos-latest
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      # The files as committed: Git for Windows would turn the line ends of
      # the fixtures and sample packs the tests compare byte for byte into
      # CRLF.
      - name: Keep the line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # The install scripts only serve the Electron build; the Tauri CLI
      # and the frontend build need none.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The toolchain of src-tauri/rust-toolchain.toml; setup-rust installs
      # the Linux packages of the app and runs on Linux only.
      - name: Install the Rust toolchain
        working-directory: src-tauri
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      # Never on a tag (a run by hand can be on one).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: src-tauri -> target
          key: bundle
          add-job-id-key: false

      - name: Clippy (debug, with the development tools)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --features pipette-app/dev-tools -- -D warnings

      # Without the development tools: build.rs rejects them in the release
      # profile.
      - name: Clippy (release)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      # The whole workspace, so the code each crate has for systems other
      # than Linux runs too, every test binary even after one fails. The
      # Linux-only tests are not built here, the Node fakes listen on the
      # loopback interface only, the OS's key store test skips without
      # PIPETTE_KEYSTORE_IT (the keystore job of tauri-migration.yml runs it
      # on purpose), and no test reaches the OS's login item
      # (pipette-autostart panics in a test that would).
      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace --no-fail-fast

      # The release build, unsigned (release.yml signs the macOS app), with
      # the bundles tauri.<platform>.conf.json lists.
      - name: Bundle
        run: pnpm exec tauri build --ci --no-sign

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipette-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
