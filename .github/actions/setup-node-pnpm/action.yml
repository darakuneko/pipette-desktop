name: Set up Node.js and pnpm
description: >-
  Installs pnpm (the version of the packageManager field of package.json) and
  Node.js 24 with the pnpm store cached. Expects the repository to be checked
  out already; installs no packages.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
