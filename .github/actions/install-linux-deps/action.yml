name: Install Linux build dependencies
description: >-
  Installs the libraries the HID code builds against on Linux (libusb and
  libudev, for node-hid and for hidapi), plus any packages a job needs on top.

inputs:
  extra-packages:
    description: Space-separated apt packages to install as well.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the apt packages
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo apt-get update
        # EXTRA_PACKAGES is a space-separated list, split on purpose.
        # shellcheck disable=SC2086
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev $EXTRA_PACKAGES
