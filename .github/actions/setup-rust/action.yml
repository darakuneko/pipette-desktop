name: Set up Rust for src-tauri
description: >-
  Installs the WebKitGTK and native build dependencies of the Tauri app, the
  toolchain of src-tauri/rust-toolchain.toml, and the Cargo cache of
  src-tauri. Expects the repository to be checked out already.

inputs:
  cache-key:
    description: >-
      The kind of build work the job does (test, lint, ...), the cache's key
      on this OS. Jobs whose builds differ must not share one: rust-cache
      saves only on a miss, so the first job to finish would save its build
      and every other job sharing the key would restore it and never save
      its own. A job that builds a subset of what the key's owner builds may
      share it with save-cache false.
    required: true
  save-cache:
    description: Whether to save the cache at the end of the job ("true" or "false").
    required: false
    default: "true"
  cache:
    description: >-
      Whether to use the cache at all ("true" or "false"). It is never used
      on a tag, whatever this says: a release is built from scratch.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The libraries Tauri builds against on Linux, libudev for hidapi's
    # hidraw backend (its linux-static-hidraw feature) and libdbus for
    # keyring's Secret Service client.
    - name: Install the Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libudev-dev libdbus-1-dev

    - uses: ./.github/actions/install-rust-toolchain

    # The key is the kind of work, not the job, so a job of another workflow
    # doing the same work reads the same cache (rust-cache adds the OS, the
    # toolchain, the CARGO_* variables and the lock file to it). A run reads
    # only the caches of its own ref and of the default branch.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true' && !startsWith(github.ref, 'refs/tags/')
      with:
        workspaces: src-tauri -> target
        key: ${{ inputs.cache-key }}
        add-job-id-key: false
        save-if: ${{ inputs.save-cache == 'true' }}
